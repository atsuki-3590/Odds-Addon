<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>オッズ歪みチェッカー</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div id="race" class="race">—</div>
    <div id="times" class="times"></div>
  </header>

  <p id="status" class="status">オッズページを開いてください。</p>

  <details class="settings">
    <summary>強調しきい値</summary>
    <form id="thresholds">
      <label>2連複が得: R ≥ <input id="th-high" type="number" step="0.01" min="1.01" required></label>
      <label>2連単2点が得: R ≤ <input id="th-low" type="number" step="0.01" max="0.99" min="0.01" required></label>
      <button type="button" id="th-reset">初期値に戻す</button>
    </form>
    <p class="note">オッズは0.1刻みで丸められているため、R が 0.95〜1.05 程度の差はノイズとみなしてください。</p>
  </details>

  <table id="table" hidden>
    <thead>
      <tr>
        <th>組</th>
        <th title="2連単 i→j">a</th>
        <th title="2連単 j→i">b</th>
        <th title="合成オッズ 1/(1/a+1/b)">合成S</th>
        <th title="2連複 i=j">2連複C</th>
        <th title="C / S">R</th>
        <th>得な買い方</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script src="src/calc.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
